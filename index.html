<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Object Schema Validator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>JSON Object Schema Validator</h1>
        
        <div class="editor-section">
            <div class="editor-group">
                <label for="schema">Schema:</label>
                <textarea id="schema" placeholder="Enter JSON schema here..."></textarea>
            </div>
            
            <div class="editor-group">
                <label for="data">Data to Validate:</label>
                <textarea id="data" placeholder="Enter JSON data here..."></textarea>
            </div>
        </div>
        
        <button id="validateBtn" class="btn-primary">Validate</button>
        
        <div id="result" class="result-section hidden">
            <h2>Validation Result</h2>
            <p id="resultMessage"></p>
            <div id="errors" class="errors hidden">
                <h3>Errors:</h3>
                <ul id="errorList"></ul>
            </div>
        </div>
    </div>
    
    <script src="validator.js"></script>
</body>
</html>
